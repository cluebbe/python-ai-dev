<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DialoGPT Web Chatbot</title>
  <style>
    /* Everything is inline so the page needs no CDN and no static/ folder. */
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --border: #d8dbe0;
      --text: #1c1e21;
      --muted: #6b7280;
      --bot: #eceef1;
      --user: #2563eb;
      --error: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --panel: #1e2027;
        --border: #33363d;
        --text: #e8eaed;
        --muted: #9aa0aa;
        --bot: #2a2d35;
        --user: #3b82f6;
        --error: #f87171;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 2rem 1rem;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .app { width: 100%; max-width: 640px; }

    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: .75rem; }
    h1 { font-size: 1.25rem; margin: 0; }
    #status { font-size: .8rem; color: var(--muted); }

    /* The transcript scrolls on its own so the input box never leaves the screen. */
    #transcript {
      height: 60vh;
      overflow-y: auto;
      padding: 1rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: .6rem;
    }

    .msg {
      max-width: 80%;
      padding: .55rem .8rem;
      border-radius: 14px;
      white-space: pre-wrap;   /* Preserve line breaks in the model's output */
      word-wrap: break-word;   /* Break long unbroken strings instead of overflowing */
    }
    .msg.user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot  { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .msg.error { align-self: center; background: transparent; color: var(--error); font-size: .875rem; text-align: center; }
    .msg.pending { color: var(--muted); font-style: italic; }

    form { display: flex; gap: .5rem; margin-top: .75rem; }

    input[type="text"] {
      flex: 1;
      padding: .7rem .9rem;
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    input[type="text"]:focus { outline: 2px solid var(--user); outline-offset: -1px; }

    button {
      padding: .7rem 1.1rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--user);
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 400; }
    button:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>DialoGPT Web Chatbot</h1>
      <span id="status">ready</span>
    </header>

    <div id="transcript" aria-live="polite"></div>

    <form id="chat-form">
      <input type="text" id="message" placeholder="Type a message…" autocomplete="off" autofocus>
      <button type="submit" id="send">Send</button>
      <button type="button" id="reset" class="secondary">Reset</button>
    </form>
  </div>

  <script>
    const transcript = document.getElementById("transcript");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const sendBtn = document.getElementById("send");
    const resetBtn = document.getElementById("reset");
    const status = document.getElementById("status");

    // Append one bubble to the transcript and scroll it into view.
    // Text is assigned with .textContent, never .innerHTML — the model's output
    // is untrusted text, and .innerHTML would execute any HTML inside it.
    function addMessage(text, kind) {
      const el = document.createElement("div");
      el.className = "msg " + kind;
      el.textContent = text;
      transcript.appendChild(el);
      transcript.scrollTop = transcript.scrollHeight;
      return el;
    }

    // POST JSON to a route and return the parsed body.
    // A non-2xx response still carries a JSON body with an "error" key, so we
    // parse first and only then decide whether to throw.
    async function postJSON(url, payload) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));   // Guard against an HTML error page instead of JSON
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();                 // Stop the browser from doing a full page reload
      const message = input.value.trim();
      if (!message) return;                   // Ignore empty submissions

      addMessage(message, "user");
      input.value = "";
      sendBtn.disabled = true;                // Block a second send while the model is busy
      status.textContent = "thinking…";
      const pending = addMessage("…", "bot pending");   // Placeholder bubble, replaced by the real reply below

      try {
        const data = await postJSON("/chat", { message });
        pending.textContent = data.reply;
        pending.className = "msg bot";
        status.textContent = `${data.history_tokens} tokens of context`;
      } catch (err) {
        pending.remove();                     // Drop the placeholder so it is not mistaken for a reply
        addMessage(err.message, "error");     // Surface the server's error text instead of failing silently
        status.textContent = "error";
      } finally {
        sendBtn.disabled = false;             // Re-enable the button whether or not the request succeeded
        input.focus();
      }
    });

    resetBtn.addEventListener("click", async () => {
      try {
        await postJSON("/reset", {});
        transcript.replaceChildren();         // Clear every bubble from the transcript
        status.textContent = "conversation reset";
        input.focus();
      } catch (err) {
        addMessage(err.message, "error");
      }
    });
  </script>
</body>
</html>
